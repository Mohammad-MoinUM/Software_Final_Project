# Mini Marketplace Application

This project contains sample configurations for different environments.
Update the database credentials and other settings as needed.
# Development Profile Configuration

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.marketplace=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator - Expose more endpoints in dev
management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always

