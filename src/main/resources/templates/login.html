<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mini Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 400px;
            max-width: 90%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .logout-msg {
            color: #28a745;
            background: #d4edda;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1rem;
            justify-content: center;
        }
        
        .role-badge.admin {
            background: #ff6b6b;
            color: white;
        }
        
        .role-badge.seller {
            background: #51cf66;
            color: white;
        }
        
        .role-badge.buyer {
            background: #339af0;
            color: white;
        }
        
        .home-link {
            text-align: center;
            margin-top: 1rem;
        }
        
        .home-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .home-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        
        <div id="roleBadge" style="display: none;"></div>
        
        <div class="error" id="errorMsg" style="display: none;"></div>
        
        <div class="logout-msg" id="logoutMsg" style="display: none;">
            You have been logged out.
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" id="loginBtn">Sign In</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
        
        <div class="home-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>
    
    <script>
        // Check for role parameter and display badge
        const urlParams = new URLSearchParams(window.location.search);
        const roleParam = urlParams.get('role');
        
        if (roleParam) {
            const roleBadge = document.getElementById('roleBadge');
            const roleIcons = {
                'admin': '⚙️',
                'seller': '🏪',
                'buyer': '🛍️'
            };
            const roleNames = {
                'admin': 'Admin',
                'seller': 'Seller',
                'buyer': 'Customer'
            };
            
            roleBadge.innerHTML = `<div class="role-badge ${roleParam}">
                <span>${roleIcons[roleParam] || ''}</span>
                <span>${roleNames[roleParam] || roleParam.toUpperCase()} Login</span>
            </div>`;
            roleBadge.style.display = 'block';
        }
        
        // Check for logout message
        if (urlParams.get('logout')) {
            document.getElementById('logoutMsg').style.display = 'block';
        }
        
        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Disable form during submission
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorMsg.style.display = 'none';
            
            const loginData = {
                username: username,
                password: password
            };
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Login successful - redirect based on role
                    const roles = result.data.roles || [];
                    
                    if (roles.includes('ADMIN')) {
                        window.location.href = '/admin-dashboard';
                    } else if (roles.includes('SELLER')) {
                        window.location.href = '/seller-dashboard';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    // Show error message
                    errorMsg.textContent = result.message || 'Invalid username or password';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = 'An error occurred. Please try again later.';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
