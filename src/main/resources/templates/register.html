<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mini Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .register-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 500px;
            max-width: 100%;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        label .required {
            color: #dc3545;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .role-selection {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .role-option {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .role-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .role-option input[type="radio"] {
            margin-right: 0.5rem;
            width: auto;
        }
        
        .role-option.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        button {
            width: 100%;
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }
        
        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>Create Account</h1>
        <p class="subtitle">Join Mini Marketplace today</p>
        
        <div class="error" id="errorMsg" style="display: none;"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" name="username" id="username" required minlength="3" maxlength="50" 
                       placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" id="email" required 
                       placeholder="your.email@example.com">
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" name="password" id="password" required minlength="6" 
                       placeholder="Minimum 6 characters">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" name="confirmPassword" id="confirmPassword" required 
                       placeholder="Re-enter your password">
            </div>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" id="fullName" maxlength="100" 
                       placeholder="Your full name">
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phoneNumber" id="phoneNumber" maxlength="20" 
                       placeholder="+880 1XXX-XXXXXX">
            </div>
            
            <div class="form-group">
                <label>Register as <span class="required">*</span></label>
                <div class="role-selection">
                    <label class="role-option">
                        <input type="radio" name="role" value="BUYER" checked>
                        <span>👤 Buyer</span>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="role" value="SELLER">
                        <span>🏪 Seller</span>
                    </label>
                </div>
            </div>
            
            <button type="submit">Create Account</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
    
    <script>
        // Password strength indicator
        const password = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        
        password.addEventListener('input', function() {
            const value = this.value;
            strengthBar.className = 'password-strength-bar';
            
            if (value.length === 0) {
                strengthBar.style.width = '0';
            } else if (value.length < 6) {
                strengthBar.classList.add('strength-weak');
            } else if (value.length < 10) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });
        
        // Form submission with API call
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match!';
                errorMsg.style.display = 'block';
                return false;
            }
            
            // Get selected role
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            
            // Prepare registration data
            const registrationData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                fullName: document.getElementById('fullName').value || null,
                phoneNumber: document.getElementById('phoneNumber').value || null,
                roles: [selectedRole]
            };
            
            try {
                // Send registration request
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(registrationData)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Registration successful - redirect to login
                    alert('Registration successful! Please log in.');
                    window.location.href = '/login';
                } else {
                    // Show error message
                    errorMsg.textContent = result.message || 'Registration failed. Please try again.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMsg.textContent = 'An error occurred. Please try again later.';
                errorMsg.style.display = 'block';
            }
        });
        
        // Role selection styling
        document.querySelectorAll('.role-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input[type="radio"]').checked = true;
            });
        });
        
        // Initialize first role as selected
        document.querySelector('.role-option').classList.add('selected');
    </script>
</body>
</html>
