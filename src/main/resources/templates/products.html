<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Mini Marketplace</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        
        .nav-links a:hover {
            opacity: 0.8;
        }
        
        .search-filter-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .search-bar input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .search-bar button {
            padding: 0.75rem 2rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .filter-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }
        
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
        }
        
        .product-info {
            padding: 1.5rem;
        }
        
        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .stars {
            color: #ffc107;
        }
        
        .product-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .cart-badge {
            position: relative;
        }
        
        .cart-badge .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
        }
        
        .no-products {
            text-align: center;
            padding: 4rem;
            color: #999;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">🛒 Mini Marketplace</div>
            <div class="nav-links" id="navLinks">
                <a href="/products">Products</a>
                <a href="/cart" class="cart-badge">🛒 Cart <span class="badge" id="cartCount">0</span></a>
                <a href="/wishlist">❤️ Wishlist</a>
                <!-- Dynamic links will be added here by JavaScript -->
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="search-filter-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for products...">
                <button onclick="searchProducts()">🔍 Search</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <select id="categoryFilter" onchange="filterProducts()">
                        <option value="">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home">Home & Living</option>
                        <option value="Books">Books</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="priceFilter" onchange="filterProducts()">
                        <option value="">All Prices</option>
                        <option value="0-1000">Under BDT 1,000</option>
                        <option value="1000-5000">BDT 1,000 - 5,000</option>
                        <option value="5000-10000">BDT 5,000 - 10,000</option>
                        <option value="10000-999999">Over BDT 10,000</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="sortFilter" onchange="sortProducts()">
                        <option value="newest">Newest First</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div id="productsContainer" class="products-grid">
            <div class="loading">Loading products...</div>
        </div>
    </div>
    
    <script>
        let allProducts = [];
        
        // Load products on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            updateCartBadge();
            loadUserInfo();
        });
        
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        const user = data.data;
                        const navLinks = document.getElementById('navLinks');
                        
                        // Add role-based navigation links
                        if (user.roles.includes('ADMIN')) {
                            navLinks.innerHTML += '<a href="/admin-dashboard">⚙️ Admin</a>';
                        }
                        if (user.roles.includes('SELLER')) {
                            navLinks.innerHTML += '<a href="/seller-dashboard">🏪 Seller</a>';
                        }
                        navLinks.innerHTML += '<a href="/dashboard">👤 ' + user.username + '</a>';
                        navLinks.innerHTML += '<a href="/logout" onclick="return confirm(\'Logout?\')" style="color: #ff6b6b;">Logout</a>';
                    }
                } else {
                    // User not logged in - show login/register
                    const navLinks = document.getElementById('navLinks');
                    navLinks.innerHTML += '<a href="/login">Login</a>';
                    navLinks.innerHTML += '<a href="/register">Register</a>';
                }
            } catch (error) {
                console.error('Error loading user info:', error);
                const navLinks = document.getElementById('navLinks');
                navLinks.innerHTML += '<a href="/login">Login</a>';
                navLinks.innerHTML += '<a href="/register">Register</a>';
            }
        }
        
        async function loadProducts() {
            try {
                const response = await fetch('/api/products/available');
                const data = await response.json();
                allProducts = data.data || [];
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = 
                    '<div class="no-products">Failed to load products</div>';
            }
        }
        
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="no-products">No products found</div>';
                return;
            }
            
            container.innerHTML = products.map(product => `
                <div class="product-card" onclick="viewProduct(${product.id})">
                    <img src="${product.imageUrl || '/images/placeholder.jpg'}" 
                         alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">BDT ${product.price}</div>
                        <div class="product-rating">
                            <span class="stars">★★★★☆</span>
                            <span>(4.5)</span>
                        </div>
                        <div class="product-actions" onclick="event.stopPropagation()">
                            <button class="btn btn-primary" onclick="addToCart(${product.id})">
                                Add to Cart
                            </button>
                            <button class="btn btn-secondary" onclick="toggleWishlist(${product.id})">
                                ❤️
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(searchTerm) || 
                (p.description && p.description.toLowerCase().includes(searchTerm))
            );
            displayProducts(filtered);
        }
        
        function filterProducts() {
            let filtered = [...allProducts];
            
            // Category filter
            const category = document.getElementById('categoryFilter').value;
            if (category) {
                filtered = filtered.filter(p => p.category === category);
            }
            
            // Price filter
            const priceRange = document.getElementById('priceFilter').value;
            if (priceRange) {
                const [min, max] = priceRange.split('-').map(Number);
                filtered = filtered.filter(p => p.price >= min && p.price <= max);
            }
            
            displayProducts(filtered);
        }
        
        function sortProducts() {
            const sortBy = document.getElementById('sortFilter').value;
            let sorted = [...allProducts];
            
            switch(sortBy) {
                case 'price-low':
                    sorted.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    sorted.sort((a, b) => b.price - a.price);
                    break;
                case 'newest':
                    sorted.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
            }
            
            displayProducts(sorted);
        }
        
        async function addToCart(productId) {
            try {
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity: 1 })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('✅ Added to cart!');
                    updateCartBadge();
                } else {
                    alert(data.message || 'Failed to add to cart');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                alert('⚠️ Please login to add items to cart');
                window.location.href = '/login';
            }
        }
        
        async function toggleWishlist(productId) {
            try {
                const response = await fetch(`/api/wishlist/add/${productId}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('❤️ Added to wishlist!');
                } else {
                    alert(data.message || 'Failed to add to wishlist');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('⚠️ Please login to add to wishlist');
                window.location.href = '/login';
            }
        }
        
        async function updateCartBadge() {
            try {
                const response = await fetch('/api/cart/count');
                const data = await response.json();
                document.getElementById('cartCount').textContent = data.data || 0;
            } catch (error) {
                console.error('Error updating cart badge:', error);
            }
        }
        
        function viewProduct(productId) {
            window.location.href = `/products/${productId}`;
        }
    </script>
</body>
</html>
