<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management - Mini Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 1.5rem 0; text-align: center; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 20px; }
        .form-card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-card h2 { margin-bottom: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 8px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .image-upload { border: 2px dashed #e0e0e0; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s; }
        .image-upload:hover { border-color: #f5576c; background: #fff5f7; }
        .image-preview { max-width: 200px; max-height: 200px; margin: 1rem auto; display: none; }
        .btn { padding: 1rem 2rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #f5576c; color: white; width: 100%; margin-top: 1rem; }
        .btn-primary:hover { background: #e04658; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    </style>
</head>
<body>
    <div class="header"><h1>🛍️ Product Management</h1></div>
    
    <div class="container">
        <div class="form-card">
            <h2 id="formTitle">Add New Product</h2>
            <form id="productForm" enctype="multipart/form-data">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="productDescription" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (BDT) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Stock Quantity *</label>
                        <input type="number" id="stockQuantity" min="0" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Category *</label>
                    <select id="productCategory" required>
                        <option value="">-- Select Category --</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Books">Books</option>
                        <option value="Home & Garden">Home & Garden</option>
                        <option value="Sports">Sports</option>
                        <option value="Toys">Toys</option>
                        <option value="Beauty">Beauty</option>
                        <option value="Food">Food</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="image-upload" onclick="document.getElementById('imageFile').click()">
                        <p>📷 Click to upload product image</p>
                        <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem;">Max size: 5MB</p>
                    </div>
                    <input type="file" id="imageFile" accept="image/*" style="display: none;" onchange="previewImage(event)">
                    <img id="imagePreview" class="image-preview">
                </div>
                
                <button type="submit" class="btn btn-primary">Save Product</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()" style="width: 100%; margin-top: 0.5rem;">Cancel</button>
            </form>
        </div>
    </div>
    
    <script>
        let editMode = false;
        
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
        
        async function loadProductForEdit() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('edit');
            
            if (productId) {
                editMode = true;
                document.getElementById('formTitle').textContent = 'Edit Product';
                
                try {
                    const response = await fetch(`/api/products/${productId}`);
                    const data = await response.json();
                    const product = data.data;
                    
                    document.getElementById('productId').value = product.id;
                    document.getElementById('productName').value = product.name;
                    document.getElementById('productDescription').value = product.description;
                    document.getElementById('productPrice').value = product.price;
                    document.getElementById('stockQuantity').value = product.stockQuantity || 0;
                    document.getElementById('productCategory').value = product.category || '';
                    
                    if (product.imageUrl) {
                        const preview = document.getElementById('imagePreview');
                        preview.src = product.imageUrl;
                        preview.style.display = 'block';
                    }
                    
                } catch (error) {
                    console.error('Error loading product:', error);
                    alert('Failed to load product details.');
                }
            }
        }
        
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const productId = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const description = document.getElementById('productDescription').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stockQuantity = parseInt(document.getElementById('stockQuantity').value);
            const category = document.getElementById('productCategory').value;
            const imageFile = document.getElementById('imageFile').files[0];
            
            try {
                // Get current user (seller)
                const userResponse = await fetch('/api/auth/me');
                const userData = await userResponse.json();
                
                if (!userData.success) {
                    alert('Please login as a seller');
                    window.location.href = '/login?role=seller';
                    return;
                }
                
                const sellerId = userData.data.userId;
                
                let imageUrl = null;
                
                // Upload image if provided
                if (imageFile) {
                    const formData = new FormData();
                    formData.append('file', imageFile);
                    
                    const uploadResponse = await fetch('/api/upload/product-image', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (uploadResponse.ok) {
                        const uploadData = await uploadResponse.json();
                        imageUrl = uploadData.data;
                    }
                }
                
                // Create or update product
                const productData = {
                    name: name,
                    description: description,
                    price: price,
                    stockQuantity: stockQuantity,
                    category: category,
                    sellerId: sellerId
                };
                
                if (imageUrl) {
                    productData.imageUrl = imageUrl;
                }
                
                let response;
                if (editMode && productId) {
                    response = await fetch(`/api/products/${productId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                } else {
                    response = await fetch('/api/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                }
                
                if (response.ok) {
                    alert(editMode ? 'Product updated successfully!' : 'Product created successfully!');
                    window.location.href = '/seller-dashboard';
                } else {
                    alert('Failed to save product.');
                }
                
            } catch (error) {
                console.error('Error saving product:', error);
                alert('Failed to save product.');
            }
        });
        
        function resetForm() {
            if (editMode) {
                window.location.href = '/seller-dashboard';
            } else {
                document.getElementById('productForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
            }
        }
        
        window.addEventListener('DOMContentLoaded', loadProductForEdit);
    </script>
</body>
</html>
