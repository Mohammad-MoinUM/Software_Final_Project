<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Mini Marketplace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1.5rem 0; }
        .header-content { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: white; text-decoration: none; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }
        .cart-container { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .cart-items { background: white; border-radius: 12px; padding: 2rem; }
        .cart-item { display: grid; grid-template-columns: 100px 1fr auto; gap: 1.5rem; padding: 1.5rem; border-bottom: 1px solid #e0e0e0; align-items: center; }
        .cart-item:last-child { border-bottom: none; }
        .item-image { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; background: #f0f0f0; }
        .item-details h3 { margin-bottom: 0.5rem; }
        .item-price { font-size: 1.2rem; font-weight: bold; color: #667eea; }
        .quantity-control { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .quantity-control button { width: 30px; height: 30px; border: 1px solid #667eea; background: white; color: #667eea; border-radius:4px; cursor: pointer; }
        .quantity-control input { width: 50px; text-align: center; border: 1px solid #e0e0e0; border-radius: 4px; padding: 0.25rem; }
        .item-actions { text-align: right; }
        .remove-btn { color: #dc3545; cursor: pointer; background: none; border: none; font-size: 1.5rem; }
        .order-summary { background: white; border-radius: 12px; padding: 2rem; height: fit-content; position: sticky; top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .summary-row.total { font-size: 1.3rem; font-weight: bold; border-top: 2px solid #e0e0e0; padding-top: 1rem; margin-top: 1rem; }
        .checkout-btn { width: 100%; padding: 1rem; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .checkout-btn:hover { background: #5568d3; }
        .empty-cart { text-align: center; padding: 4rem; }
        .empty-cart img { width: 200px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">🛒 Mini Marketplace</div>
            <div class="nav-links">
                <a href="/products">Products</a>
                <a href="/dashboard">Dashboard</a>
                <a href="/wishlist">Wishlist</a>
            </div>
        </div>
    </div>
    
    <div class="container">
        <h1 style="margin-bottom: 2rem;">Shopping Cart</h1>
        <div class="cart-container" id="cartContainer">
            <div class="cart-items" id="cartItems">
                <div style="text-align: center; padding: 2rem;">Loading cart...</div>
            </div>
            <div class="order-summary">
                <h2 style="margin-bottom: 1.5rem;">Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">BDT 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping">BDT 50</span>
                </div>
                <div class="summary-row">
                    <span>Tax</span>
                    <span id="tax">BDT 0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">BDT 0</span>
                </div>
                <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>
    
    <script>
        let cartItems = [];
        
        async function loadCart() {
            try {
                const response = await fetch('/api/cart');
                const data = await response.json();
                cartItems = data.data || [];
                displayCart();
                updateSummary();
            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('cartItems').innerHTML = 
                    '<div class="empty-cart"><h2>Please login to view your cart</h2></div>';
            }
        }
        
        function displayCart() {
            const container = document.getElementById('cartItems');
            
            if (cartItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some products to get started</p>
                        <a href="/products" class="checkout-btn" style="display: inline-block; margin-top: 1rem; text-decoration: none;">
                            Continue Shopping
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = cartItems.map(item => `
                <div class="cart-item">
                    <img src="${item.productImageUrl || '/images/placeholder.jpg'}" class="item-image" alt="${item.productName}">
                    <div class="item-details">
                        <h3>${item.productName}</h3>
                        <div class="item-price">BDT ${item.productPrice}</div>
                        <div class="quantity-control">
                            <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <input type="number" value="${item.quantity}" readonly>
                            <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                        <div style="margin-top: 0.5rem; color: #666;">
                            Subtotal: BDT ${item.subtotal}
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="remove-btn" onclick="removeItem(${item.id})" title="Remove">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        async function updateQuantity(cartItemId, newQuantity) {
            if (newQuantity < 1) return;
            
            try {
                const response = await fetch(`/api/cart/${cartItemId}?quantity=${newQuantity}`, {
                    method: 'PUT'
                });
                if (response.ok) {
                    loadCart();
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }
        
        async function removeItem(cartItemId) {
            if (!confirm('Remove this item from cart?')) return;
            
            try {
                const response = await fetch(`/api/cart/${cartItemId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadCart();
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }
        
        function updateSummary() {
            const subtotal = cartItems.reduce((sum, item) => sum + parseFloat(item.subtotal), 0);
            const shipping = cartItems.length > 0 ? 50 : 0;
            const tax = subtotal * 0.05; // 5% tax
            const total = subtotal + shipping + tax;
            
            document.getElementById('subtotal').textContent = `BDT ${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = `BDT ${shipping.toFixed(2)}`;
            document.getElementById('tax').textContent = `BDT ${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `BDT ${total.toFixed(2)}`;
        }
        
        function proceedToCheckout() {
            if (cartItems.length === 0) {
                alert('Your cart is empty');
                return;
            }
            window.location.href = '/checkout';
        }
        
        window.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
