<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Mini Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        p {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
        }
        
        .info {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .info p {
            font-size: 1em;
            color: #555;
            margin-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${message}">Mini Marketplace</h1>
        <p>Your Spring Boot application is up and running!</p>
        
        <div class="info">
            <p><strong>Project Status:</strong> Skeleton Ready ✓</p>
            <p><strong>Architecture:</strong> Layered Structure Implemented</p>
            <p>
                <span class="badge">Spring Boot</span>
                <span class="badge">Java 17</span>
                <span class="badge">Thymeleaf</span>
                <span class="badge">Spring Security</span>
                <span class="badge">JPA</span>
                <span class="badge">PostgreSQL</span>
            </p>
        </div>
    </div>
</body>
</html>
