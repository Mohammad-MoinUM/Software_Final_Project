<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Mini Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        p {
            color: #666;
            font-size: 1.2rem;
            line-height: 1.6;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }
        
        .features {
            margin-top: 2rem;
            text-align: left;
        }
        
        .features h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .features ul {
            list-style: none;
        }
        
        .features li {
            padding: 0.5rem 0;
            color: #555;
        }
        
        .features li:before {
            content: "✓ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${title}">Mini Marketplace</h1>
        <p th:text="${message}">Welcome to Mini Marketplace!</p>
        <span class="badge">Spring Boot Application</span>
        
        <div class="features">
            <h2>Technology Stack</h2>
            <ul>
                <li>Java 17</li>
                <li>Spring Boot 3.2</li>
                <li>Spring Security</li>
                <li>Spring Data JPA</li>
                <li>Thymeleaf</li>
                <li>PostgreSQL</li>
                <li>Maven</li>
                <li>Lombok</li>
            </ul>
        </div>
    </div>
</body>
</html>
